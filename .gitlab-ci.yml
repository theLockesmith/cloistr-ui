stages:
  - build
  - publish
  - trigger

include:
  - project: 'coldforge/ci-templates'
    ref: main
    file: '/templates/npm-publish.yml'

variables:
  NODE_VERSION: "22"

build:
  stage: build
  image: node:${NODE_VERSION}-alpine
  script:
    - npm ci
    - npm run build
  artifacts:
    paths:
      - dist/
    expire_in: 1 hour
  cache:
    key: ${CI_COMMIT_REF_SLUG}
    paths:
      - node_modules/

publish:
  extends: .npm-publish
  dependencies:
    - build
  only:
    - main
    - master
    - tags

trigger-renovate:
  stage: trigger
  needs: ["publish"]
  trigger:
    project: coldforge/ci-templates
    branch: main
  only:
    - main
    - master
    - tags
